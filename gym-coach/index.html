<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: camera stage fills the left, a narrow control rail on the right; stacks on phones.
   Dark by design: the screen sits in a garage gym and is read from two or three metres away. */
:root {
  color-scheme: dark;
  --bg: #12161c;
  --surface: #1a2029;
  --raised: #232b36;
  --line: #313b49;
  --fg: #eef1f4;
  --muted: #9aa6b4;
  --track: #4fd1c5;   /* tracking + primary actions */
  --rest: #f2b84b;    /* rest timer */
  --fix: #ff7a6b;     /* form faults */
  --good: #7bd88f;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--track); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.stage { position: relative; background: #000; min-height: 0; overflow: hidden; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }

.hud { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 16px; gap: 8px; }
.hud > * { pointer-events: auto; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.plate { background: rgb(18 22 28 / 0.78); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px); }
.now-ex { font: 600 28px/1.05 var(--display); letter-spacing: 0.01em; text-transform: uppercase; }
.now-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.weight { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.weight input { width: 84px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 600 22px/1 var(--display); text-align: center; }
.weight .unit { color: var(--muted); }
.weight .src { font-size: 11px; color: var(--track); }
.step { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-size: 18px; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font: 600 13px/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; background: rgb(18 22 28 / 0.78); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.idle { color: var(--muted); } .chip.set { color: var(--rest); } .chip.ready { color: var(--track); } .chip.work { color: var(--good); } .chip.rest { color: var(--rest); }
.track-note { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: right; max-width: 260px; }
.track-note.warn { color: var(--rest); }

.hud-right { display: grid; justify-items: end; gap: 6px; }
.hud-right .row { justify-content: flex-end; }
.hud-mid { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; min-height: 0; }
.alert { font: 600 clamp(22px, 3vw, 38px)/1.1 var(--display); text-transform: uppercase; color: #1d1300; background: var(--rest); padding: 12px 20px; border-radius: 10px; text-align: center; max-width: 90%; }
.restcard { background: rgb(18 22 28 / 0.85); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; max-width: min(760px, 92%); text-align: center; backdrop-filter: blur(6px); display: grid; gap: 8px; }
.restcard p { margin: 0; }
.coachline { font-size: clamp(16px, 1.9vw, 24px); line-height: 1.3; }
.nextline { font: 600 clamp(18px, 2.3vw, 30px)/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--rest); }
.repblock { display: grid; gap: 8px; justify-items: start; }
.big .of { font-size: 0.32em; color: var(--muted); margin-left: 0.25em; letter-spacing: 0.02em; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; max-width: 46vw; min-height: 16px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--good); box-shadow: 0 1px 6px rgb(0 0 0 / 0.6); }
.dots i.fix { background: var(--fix); }
.lbl { font: 600 16px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { align-self: flex-end; color: var(--fg); font-size: 13px; background: rgb(18 22 28 / 0.7); border-radius: 999px; padding: 6px 12px; text-align: center; }
.hint:empty { display: none; }
.hint { font-size: clamp(14px, 1.6vw, 20px); padding: 8px 16px; }
.hint.go { background: var(--good); color: #06200d; font-weight: 600; }
#repNum.maybe { opacity: 0.45; }
.restadj { justify-content: flex-end; margin-top: 8px; font: 14px var(--body); }
.restadj .btn { color: var(--fg); }
.bar { height: 8px; border-radius: 4px; background: rgb(255 255 255 / 0.18); overflow: hidden; margin: 10px 0 6px; }
.bar i { display: block; height: 100%; width: 0; background: currentColor; }
.hold { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); width: min(360px, 70%); background: rgb(18 22 28 / 0.9); border: 1px solid var(--track); border-radius: 12px; padding: 12px 16px; text-align: center; font: 600 22px/1.1 var(--display); text-transform: uppercase; color: var(--track); }
.hold .bar { margin: 10px 0 0; }
.flagsheet { position: absolute; right: 16px; top: 64px; width: min(360px, calc(100% - 32px)); background: rgb(18 22 28 / 0.95); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; z-index: 2; }
.flagsheet input, .gate textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); width: 100%; }
.flagsheet .pill { font-size: 13px; padding: 7px 11px; }
.app.focus { grid-template-columns: minmax(0, 1fr); } .app.focus .rail { display: none; }
.app.setup { grid-template-columns: minmax(0, 1fr); } .app.setup .rail { display: none; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
.choice b { font: 600 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.choice span { color: var(--muted); font-size: 13px; }
.choice[aria-pressed="true"], .pill[aria-pressed="true"] { border-color: var(--track); background: var(--raised); box-shadow: inset 0 0 0 1px var(--track); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-weight: 600; }
.steps { color: var(--muted); font: 600 12px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; }
.gate h2 { font: 600 14px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.daylist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.daylist li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.daylist b { font: 600 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; display: block; margin-bottom: 2px; }
.daylist span { color: var(--muted); font-size: 13px; }
.delta { font-weight: 600; } .delta.up { color: var(--good); } .delta.same { color: var(--muted); } .delta.down { color: var(--rest); }
.week { display: grid; gap: 6px; }
.week .w { display: grid; grid-template-columns: 150px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.week .t { height: 10px; border-radius: 5px; background: var(--bg); position: relative; overflow: hidden; }
.week .t i { position: absolute; inset: 0 auto 0 0; background: var(--rest); border-radius: 5px; }
.week .t i.ok { background: var(--good); }
.week .t::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: 0.6; }
.week .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.cue { font: 600 clamp(22px, 3.2vw, 40px)/1.1 var(--display); text-transform: uppercase; padding: 10px 18px; border-radius: 10px; background: rgb(18 22 28 / 0.85); border: 1px solid var(--line); text-align: center; max-width: 90%; }
.cue.fix { color: var(--fix); border-color: var(--fix); } .cue.good { color: var(--good); border-color: var(--good); }
.hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.big { font: 700 clamp(72px, 13vw, 168px)/0.85 var(--display); font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgb(0 0 0 / 0.7); }
.big small, .timer .lbl { display: block; font: 600 16px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-shadow: none; }
.big.reps { color: var(--fg); } .big.timer { color: var(--rest); text-align: right; }
.big.timer.over { color: var(--fix); }

.gate { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 24px; overflow: auto; }
.gate-card { width: min(640px, 100%); display: grid; gap: 14px; }
.gate-card > div { display: grid; gap: 14px; }
.gate h1 { font: 700 56px/0.95 var(--display); text-transform: uppercase; margin: 0; letter-spacing: 0.01em; }
.gate p { margin: 0; color: var(--muted); max-width: 60ch; }
.gate ol { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.btn.primary { background: var(--track); border-color: var(--track); color: #06201d; }
.btn.danger { color: var(--fix); }
.btn.small { padding: 5px 9px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.err { color: var(--fix); }

.rail { background: var(--surface); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 4px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--track); }
.pane { overflow: auto; padding: 14px 16px 24px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.pane h2 { font: 600 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
.pane h3 { font: 600 12px/1.2 var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.coach { border-color: var(--track); }
.coach p { margin: 0; font-size: 15px; }
.coach .by { font-size: 11px; color: var(--muted); }

.queue { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.queue li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.queue li.current { border-color: var(--track); background: var(--raised); }
.queue .q-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.queue .q-name { font-weight: 600; background: none; border: 0; padding: 0; text-align: left; }
.queue .q-target { color: var(--muted); font-size: 12px; white-space: nowrap; }
.sets { display: flex; gap: 6px; flex-wrap: wrap; }
.setchip { font: 600 13px/1 var(--body); font-variant-numeric: tabular-nums; padding: 5px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.setchip.todo { color: var(--muted); border-style: dashed; background: none; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.kv div { background: var(--bg); border-radius: 8px; padding: 8px; }
.gate .kv div { background: var(--surface); border: 1px solid var(--line); padding: 12px; }
.gate .kv b { font-size: 34px; }
.kv b { display: block; font: 600 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.kv span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.replist { display: grid; gap: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
.replist div { display: grid; grid-template-columns: 26px 54px 1fr; gap: 6px; }
.replist .f { color: var(--fix); } .replist .g { color: var(--good); }

label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 10px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.checks input { accent-color: var(--track); width: 16px; height: 16px; }
.note.err { color: var(--fix); }
.scan { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.targets { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }
.field input, .field select, .field textarea, .plan-ex input, .plan-ex select, .day-name {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; color: var(--fg); min-width: 0; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.day { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.plan-ex { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 6px; align-items: start; }
.plan-ex .nums { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; grid-column: 1; }
.plan-ex .nums label { font-size: 10px; color: var(--muted); display: grid; gap: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
.plan-ex .x { grid-row: 1 / span 2; grid-column: 2; align-self: stretch; }
.hist { display: grid; gap: 4px; }
.hist .line { font-size: 13px; font-variant-numeric: tabular-nums; }
.hist .line b { font-weight: 600; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { height: 62vh; }
  .rail { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
}
@media (prefers-reduced-motion: no-preference) { .cue { transition: opacity 0.2s; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage mirror" id="stage" aria-label="Camera">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="hud-top">
        <div class="plate">
          <div class="now-ex" id="nowEx">—</div>
          <div class="now-sub" id="nowSub"></div>
          <div class="weight" id="weightBox">
            <button class="step" id="wDown" aria-label="Less weight">−</button>
            <input id="weight" inputmode="decimal" aria-label="Weight for this set">
            <span class="unit" id="unit">lb</span>
            <button class="step" id="wUp" aria-label="More weight">+</button>
            <span class="src" id="wSrc"></span>
          </div>
        </div>
        <div class="hud-right">
          <div class="row"><span class="chip idle" id="stateChip">Idle</span><button class="btn small" id="flagBtn">Flag a problem</button><button class="btn small" id="panelToggle">Hide panel</button></div>
          <div class="track-note" id="trackNote"></div>
        </div>
      </div>
      <div class="hud-mid">
        <div class="alert" id="alert" hidden></div>
        <div class="restcard" id="restCard" hidden><p class="coachline" id="coachLine"></p><p class="nextline" id="nextLine"></p><div class="row" style="justify-content:center"><button class="btn small" id="redoBtn">That count was wrong, redo the set</button></div></div>
        <div class="cue" id="cue" hidden></div>
      </div>
      <div class="hud-bottom">
        <div class="repblock">
          <div class="big reps"><span id="repNum">0</span><span class="of" id="repOf"></span></div>
          <div class="dots" id="repDots"></div>
          <div class="lbl" id="repLabel">reps</div>
        </div>
        <div class="hint" id="hint"></div>
        <div class="big timer" id="timerBox" hidden><span id="timerNum">0:00</span><div class="bar"><i id="timerBar"></i></div><small id="timerLabel">rest</small><div class="row restadj"><button class="btn small" id="restLess">− 15 s</button><button class="btn small" id="restMore">+ 15 s</button></div></div>
      </div>
      <div class="flagsheet" id="flagSheet" hidden>
        <b>What went wrong?</b>
        <div class="pills" id="flagReasons"></div>
        <input id="flagNote" placeholder="Add a note first, if you like" aria-label="Note for this flag">
        <div class="row"><button class="btn small" id="flagCancel">Cancel</button></div>
      </div>
      <div class="hold" id="hold" hidden><span id="holdText">Hold to end the set</span><div class="bar"><i id="holdBar"></i></div></div>
    </div>

    <div class="gate" id="gate">
      <div class="gate-card">
        <div id="gateBody"></div>
        <input type="file" id="file" accept="video/*" hidden>
        <p id="gateMsg" class="note"></p>
      </div>
    </div>
  </section>

  <aside class="rail">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="session" aria-selected="true">Workout</button>
      <button role="tab" data-tab="plan" aria-selected="false">Split</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
      <button role="tab" data-tab="you" aria-selected="false">You</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<script id="engine">
/* Pure tracking logic: joint angles, rep state machine, form rules, set summaries.
   No DOM access, so tests can run it in Node. */
(function (root) {
  'use strict';
  const J = { lSh: 11, rSh: 12, lEl: 13, rEl: 14, lWr: 15, rWr: 16, lHip: 23, rHip: 24, lKn: 25, rKn: 26, lAn: 27, rAn: 28 };
  const deg = (r) => r * 180 / Math.PI;
  const sub = (a, b) => [a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0)];
  const len = (v) => Math.hypot(v[0], v[1], v[2]);
  const dist = (a, b) => len(sub(a, b));
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: ((a.z || 0) + (b.z || 0)) / 2 });
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const vis = (p, ids) => Math.min(...ids.map((i) => (p[i].visibility == null ? 1 : p[i].visibility)));
  function ang(a, b, c) {
    const u = sub(a, b), w = sub(c, b), n = len(u) * len(w);
    return n ? deg(Math.acos(clamp((u[0] * w[0] + u[1] * w[1] + u[2] * w[2]) / n, -1, 1))) : 180;
  }
  // avg: both sides averaged when both are clearly visible, else the visible one. min: the more bent side (one-sided lifts).
  function pair(p, idsL, idsR, fL, fR) {
    const a = vis(p, idsL), b = vis(p, idsR), l = fL(), r = fR();
    return { avg: a > 0.65 && b > 0.65 ? (l + r) / 2 : (a >= b ? l : r), min: a > 0.5 && b > 0.5 ? Math.min(l, r) : (a >= b ? l : r) };
  }
  const sides = (p, idsL, idsR, fL, fR) => pair(p, idsL, idsR, fL, fR).avg;

  /* w: world landmarks (metres, y points down). p: image landmarks (0..1). aspect: width / height. */
  function measure(w, p, aspect) {
    const mSh = mid(w[J.lSh], w[J.rSh]), mHip = mid(w[J.lHip], w[J.rHip]);
    const torso = dist(mSh, mHip) || 1e-6;
    const thighOf = (hip, kn) => deg(Math.asin(clamp((w[kn].y - w[hip].y) / (dist(w[hip], w[kn]) || 1e-6), -1, 1)));
    const kn = pair(p, [J.lHip, J.lKn, J.lAn], [J.rHip, J.rKn, J.rAn], () => ang(w[J.lHip], w[J.lKn], w[J.lAn]), () => ang(w[J.rHip], w[J.rKn], w[J.rAn]));
    const hp = pair(p, [J.lSh, J.lHip, J.lKn], [J.rSh, J.rHip, J.rKn], () => ang(w[J.lSh], w[J.lHip], w[J.lKn]), () => ang(w[J.rSh], w[J.rHip], w[J.rKn]));
    const eb = pair(p, [J.lSh, J.lEl, J.lWr], [J.rSh, J.rEl, J.rWr], () => ang(w[J.lSh], w[J.lEl], w[J.lWr]), () => ang(w[J.rSh], w[J.rEl], w[J.rWr]));
    const m = {
      knee: kn.avg, kneeMin: kn.min, hip: hp.avg, hipMin: hp.min, elbow: eb.avg, elbowMin: eb.min,
      shoulder: sides(p, [J.lHip, J.lSh, J.lEl], [J.rHip, J.rSh, J.rEl], () => ang(w[J.lHip], w[J.lSh], w[J.lEl]), () => ang(w[J.rHip], w[J.rSh], w[J.rEl])),
      thigh: sides(p, [J.lHip, J.lKn], [J.rHip, J.rKn], () => thighOf(J.lHip, J.lKn), () => thighOf(J.rHip, J.rKn)),

        ...d.exercises.map((x, xi) => el('div', { class: 'plan-ex' },
          el('select', { 'aria-label': 'Exercise', id: 'ps-' + uid(), onchange: (e) => { x.id = e.target.value; touch(); renderPane(); } }, exOptions(x)),
          el('button', { class: 'btn small x', 'aria-label': 'Remove exercise', onclick: () => { d.exercises.splice(xi, 1); touch(); renderPane(); } }, '×'),
          el('div', { class: 'nums' }, num('Sets', x, 'sets', 1), num('Min', x, 'lo', 1), num('Max', x, 'hi', 1), num(S.profile.units, x, 'weight', 0), num('Rest s', x, 'rest', 0)))),
        el('button', { class: 'btn small', onclick: () => { d.exercises.push(ex(options('knee', eq)[0] || 'manual', 3, 6, 10, 0, 120)); touch(); renderPane(); } }, '+ Exercise'))),
      el('button', { class: 'btn', onclick: () => { S.plan.push({ key: uid(), name: 'New day', exercises: [] }); touch(); renderPane(); } }, '+ Day')];
  }

  function paneLog() {
    const out = [el('h2', {}, 'Training log')];
    if (recList.length) out.push(el('div', { class: 'card' }, el('h3', {}, 'Session recordings'),
      el('p', { class: 'note' }, 'The last five are kept in this browser. Save one and send it to Claude to tune the tracking.'),
      recList.map((r) => el('div', { class: 'row' }, el('span', { style: 'flex:1;min-width:0;font-size:13px' }, new Date(r.started).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + r.day + ' · ' + recLine(r)),
        el('button', { class: 'btn small', onclick: () => recSave(r, true) }, 'Save'), el('button', { class: 'btn small', onclick: () => recSave(r, false) }, 'No photos'),
        el('button', { class: 'btn small danger', onclick: async () => { try { await idb('readwrite', (st) => st.delete(r.started)); } catch (e) { /* ignore */ } recLoad(); } }, 'Delete')))));
    if (S.history.length) {
      const wk = weeklySets(S.history, Date.now());
      out.push(el('div', { class: 'card' }, el('h3', {}, 'Hard sets per muscle, last 7 days'),
        el('div', { class: 'week' }, Object.entries(wk).map(([k, v]) => el('div', { class: 'w' }, el('span', {}, k), el('span', { class: 't' }, el('i', { class: v >= 10 ? 'ok' : '', style: `width:${Math.min(100, v / 20 * 100)}%` })), el('span', { class: 'v' }, String(+v.toFixed(1)))))),
        el('p', { class: 'note' }, 'The line marks 10 sets, the weekly amount research links to more growth. Presses and pulls count half for the arms and shoulders they also work.')));
    }
    if (!S.history.length) out.push(el('p', { class: 'note' }, 'Finished workouts appear here with every set, rest time and form flag.'));
    for (const h of [...S.history].reverse()) {
      out.push(el('div', { class: 'card hist' }, el('h3', {}, new Date(h.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + h.dayName),
        h.items.map((i) => el('div', { class: 'line' }, el('b', {}, EX[i.id].name + ': '), i.done.map(setText).join(', ')))));
    }
    if (S.history.length) out.push(el('div', { class: 'row' },
      el('button', { class: 'btn small', onclick: () => { const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(S.history, null, 2)], { type: 'application/json' })), download: 'spotter-log.json' }); a.click(); } }, 'Export as JSON'),
      el('button', { class: 'btn small danger', id: 'clearLog', onclick: (e) => { if (e.target.dataset.sure) { S.history = []; save(); renderPane(); } else { e.target.dataset.sure = 1; e.target.textContent = 'Click again to delete all'; } } }, 'Clear log')));
    return out;
  }

  /* Equipment from photos: Claude lists what it can see; nothing changes until the user accepts. */
  let eqScan = null;
  const EQ_SYS = `You identify home-gym equipment in photos so a training app knows which exercises are possible.
Report only equipment you can actually see; do not guess at what is out of frame. Map what you see to these ids:
barbell (a barbell with plates), rack (squat rack, power rack or squat stands), bench (a flat bench), incline (an adjustable bench that inclines; do not also list bench), dumbbells (fixed or adjustable), kettlebell, pullupbar (any pull-up bar, including one built into a rack), dipbars (dip station, dip handles or parallel bars), bands (resistance bands), cable (cable machine, lat pulldown or pulley system).
Reply with JSON only: {"found": [{"id": "<id>", "evidence": "<a few words on what you saw>"}], "other": ["<equipment visible that fits none of the ids>"], "limits": "<weights you can read, such as dumbbells up to 50 lb, or an empty string>"}`;
  async function toJpeg(file) {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82).split(',')[1];
  }
  async function scanEquipment(files) {
    if (!files.length) return;
    eqScan = { busy: true }; renderPane();
    try {
      const content = [];
      for (const f of files.slice(0, 6)) {
        let data; try { data = await toJpeg(f); } catch (e) { throw new Error(`Could not open ${f.name}. Use JPEG or PNG photos.`); }
        content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } });
      }
      content.push({ type: 'text', text: `These ${content.length} photo(s) show my home gym. List the equipment.` });
      const r = await claude(EQ_SYS, content);
      const seen = new Set();
      eqScan = { found: (r.found || []).filter((f) => f && EQUIP[f.id] && !seen.has(f.id) && seen.add(f.id)).map((f) => ({ id: f.id, evidence: String(f.evidence || '') })),
        other: (r.other || []).map(String).filter(Boolean), limits: String(r.limits || '') };
    } catch (e) { eqScan = { err: e.message }; }
    if (tab === 'you') renderPane();
  }

  /* Goal targets shown under You. Figures and their sources are in reports/Muscle gain methods by goal.md. */
  function targetNodes() {
    const P = S.profile, n = (v) => { const x = parseFloat(v); return isFinite(x) && x > 0 ? x : null; };
    const bw = n(P.bodyweight), kg = bw && (P.units === 'kg' ? bw : bw / 2.2046), h = n(P.height), w = n(P.waist), age = n(P.age), u = P.units;
    const r1 = (x) => (Math.round(x * 10) / 10).toString();
    const lines = [];
    if (P.goal === 'general') lines.push('Train every major muscle group at least 2 days a week. Showing up consistently matters more than the exact programme.');
    else lines.push(P.goal === 'strength' ? 'Lift heavy on your main lifts (sets of 3 to 6) with long rests, and keep some higher-rep work for size.'
      : 'Aim for 10 or more hard sets per muscle each week, ending most sets 1 to 2 reps short of failure. The built split is sized for this.');
    lines.push(kg ? `Protein: ${Math.round(kg * 1.6)} to ${Math.round(kg * 2.2)} g a day (1.6 to 2.2 g per kg), spread over 3 or more meals.` : 'Protein: 1.6 to 2.2 g per kg of bodyweight a day. Enter your bodyweight for a number.');
    if (P.goal === 'muscle' || P.goal === 'strength') lines.push(bw ? `Weight gain: ${r1(bw * 0.0025)} to ${r1(bw * 0.005)} ${u} a week (0.25 to 0.5% of bodyweight). Faster mostly adds fat.` : 'Weight gain: 0.25 to 0.5% of bodyweight a week. Faster mostly adds fat.');
    if (P.goal === 'fatloss') lines.push(bw ? `Weight loss: about ${r1(bw * 0.007)} ${u} a week or slower, which protects muscle better than faster loss.` : 'Weight loss: about 0.7% of bodyweight a week or slower protects muscle better than faster loss.');
    if (P.goal !== 'general') lines.push('Creatine monohydrate, 3 to 5 g a day, is the best-supported supplement. Sleep 7 hours or more.');
    if (h && w) { const ratio = w / h; lines.push(`Waist-to-height: ${ratio.toFixed(2)}. UK guidance (NICE) is to keep it under 0.5${ratio >= 0.5 && P.goal === 'muscle' ? ', so hold your weight steady and build muscle at maintenance before adding a surplus' : ''}.`); }
    if (P.background === 'southasian') {
      if (P.goal === 'muscle' || P.goal === 'strength') lines.push('Gain at the slow end and watch your waist. In a small overfeeding study, young South Asian men lost more insulin sensitivity from rapid weight gain than white European men did.');
      lines.push('Ask your doctor about a baseline blood sugar and cholesterol check. UK and US guidance screens South Asian adults earlier and at a lower BMI (23).');
      lines.push('A 12-week trial found South Asian and white European men built muscle equally well from the same training.');
    }
    if (age && age >= 30 && age < 46) lines.push('Trials have not found a meaningful drop in muscle gain before the mid-40s. Add load gradually, since tendons adapt more slowly than muscle.');
    return [el('h3', {}, 'Your targets'), el('ul', { class: 'targets' }, lines.map((t) => el('li', {}, t))),
      el('p', { class: 'note' }, 'General guidance from published research, not medical advice. Check with a doctor first if you have kidney disease or diabetes.')];
  }

  function paneYou() {
    const P = S.profile, T = S.settings;
    const field = (label, node) => el('label', { class: 'field' }, label, node);
    const len = P.units === 'kg' ? 'cm' : 'in';
    const refreshTargets = () => { const t = $('targets'); if (t) t.replaceChildren(...targetNodes()); };
    const bind = (obj, key, attrs = {}) => ({ id: 'f-' + key, value: obj[key], oninput: (e) => { obj[key] = e.target.value; save(); }, ...attrs });
    const sel = (obj, key, opts, after) => el('select', { id: 'f-' + key, onchange: (e) => { const v = e.target.value; obj[key] = v === 'true' ? true : v === 'false' ? false : v; save(); if (after) after(); } },
      opts.map(([v, t]) => el('option', { value: v, selected: String(obj[key]) === String(v) }, t)));
    const b = P.body;
    const out = [el('h2', {}, 'You'),
      field('Main goal', sel(P, 'goal', [['muscle', 'Build muscle'], ['strength', 'Get stronger'], ['fatloss', 'Lose fat, keep muscle'], ['general', 'General fitness']], refreshTargets)),
      el('div', { class: 'grid2' },
        field('Experience', sel(P, 'level', [['beginner', 'Under 1 year'], ['intermediate', '1–3 years'], ['advanced', '3+ years']])),
        field('Units', sel(P, 'units', [['lb', 'Pounds'], ['kg', 'Kilograms']], () => { renderHud(); renderPane(); }))),
      el('div', { class: 'grid2' }, field('Age', el('input', bind(P, 'age', { inputmode: 'numeric', oninput: (e) => { P.age = e.target.value; save(); refreshTargets(); } }))),
        field(`Bodyweight (${P.units})`, el('input', bind(P, 'bodyweight', { inputmode: 'decimal', oninput: (e) => { P.bodyweight = e.target.value; save(); refreshTargets(); } })))),
      el('div', { class: 'grid2' }, field(`Height (${len})`, el('input', bind(P, 'height', { inputmode: 'decimal', oninput: (e) => { P.height = e.target.value; save(); refreshTargets(); } }))),
        field(`Waist (${len})`, el('input', bind(P, 'waist', { inputmode: 'decimal', oninput: (e) => { P.waist = e.target.value; save(); refreshTargets(); } })))),
      field('Background (optional, adjusts health guidance)', sel(P, 'background', [['', 'Not set'], ['southasian', 'South Asian'], ['other', 'Other']], refreshTargets)),
      el('div', { class: 'card', id: 'targets' }, targetNodes()),
      field('Injuries, limits, anything the coach should know', el('textarea', bind(P, 'notes', { rows: 3 }))),
      el('div', { class: 'card' }, el('h3', {}, 'Your equipment'),
        P.equipmentSet ? null : el('p', { class: 'note' }, 'These ticks are a guess. Tick what you actually have; bodyweight lifts are always available.'),
        el('div', { class: 'checks' }, Object.entries(EQUIP).map(([id, label]) => el('label', {}, el('input', { type: 'checkbox', id: 'eq-' + id, checked: P.equipment.includes(id), onchange: (e) => {
          P.equipment = e.target.checked ? [...P.equipment, id] : P.equipment.filter((x) => x !== id); P.equipmentSet = true; save(); renderPane(); } }), ' ' + label))),
        el('p', { class: 'note' }, `${Object.keys(EX).filter((id) => EX[id].pattern && available(id, P.equipment)).length} of ${Object.keys(EX).filter((id) => EX[id].pattern).length} lifts available. Spotter only offers lifts you can do, and the Split tab can build a split from this list.`),
        el('div', { class: 'row' },
          el('button', { class: 'btn small', id: 'eqPhotoBtn', disabled: !T.apiKey || (eqScan && eqScan.busy), onclick: () => $('eqPhotos').click() }, eqScan && eqScan.busy ? 'Reading photos…' : 'Identify from photos'),
          el('input', { type: 'file', id: 'eqPhotos', accept: 'image/*', multiple: true, hidden: true, onchange: (e) => scanEquipment([...e.target.files]) }),
          el('span', { class: 'note' }, T.apiKey ? 'Up to 6 photos of your gym. They are sent to Anthropic to be read.' : 'Photo reading needs a Claude API key (below).')),
        eqScan && eqScan.err ? el('p', { class: 'note err' }, eqScan.err) : null,
        eqScan && eqScan.found ? el('div', { class: 'scan' },
          el('h3', {}, 'Seen in your photos'),
          eqScan.found.length ? el('ul', { class: 'targets' }, eqScan.found.map((f) => el('li', {}, el('b', {}, EQUIP[f.id]), f.evidence ? ': ' + f.evidence : '', P.equipment.includes(f.id) ? ' (already ticked)' : ''))) : el('p', { class: 'note' }, 'Nothing from Spotter\'s list was clearly visible.'),
          eqScan.other.length ? el('p', { class: 'note' }, 'Also seen, not yet used by Spotter for picking lifts: ' + eqScan.other.join(', ') + '. The coach is told about these.') : null,
          eqScan.limits ? el('p', { class: 'note' }, 'Weights read: ' + eqScan.limits) : null,
          el('div', { class: 'row' },
            el('button', { class: 'btn small primary', id: 'eqApply', onclick: () => {
              P.equipment = [...new Set([...P.equipment, ...eqScan.found.map((f) => f.id)])]; P.equipmentSet = true;
              P.equipmentOther = eqScan.other; P.equipmentLimits = eqScan.limits; eqScan = null; save(); renderPane(); } }, 'Add these to my equipment'),
            el('button', { class: 'btn small', onclick: () => { eqScan = null; renderPane(); } }, 'Discard'))) : null,
        P.equipmentOther && P.equipmentOther.length ? el('p', { class: 'note' }, 'Other equipment on file: ' + P.equipmentOther.join(', ') + (P.equipmentLimits ? '. ' + P.equipmentLimits : '')) : null),
      el('div', { class: 'card' }, el('h3', {}, 'Proportions measured by camera'),
        b ? el('div', { class: 'kv' }, el('div', {}, el('b', {}, String(b.femur_to_torso)), el('span', {}, 'femur : torso')), el('div', {}, el('b', {}, String(b.shin_to_femur)), el('span', {}, 'shin : femur')), el('div', {}, el('b', {}, String(b.arm_to_torso)), el('span', {}, 'arm : torso')))
          : el('p', { class: 'note' }, 'Stand tall in full view for a couple of seconds and Spotter measures your limb proportions.'),
        b ? el('div', { class: 'row' }, el('span', { class: 'note' }, 'Estimates. Sent to the coach as context.'), el('button', { class: 'btn small', onclick: () => { P.body = null; bodyAcc = null; save(); renderPane(); } }, 'Measure again')) : null),
      el('h2', {}, 'Coach and camera'),
      field('Claude API key (optional)', el('input', bind(T, 'apiKey', { type: 'password', autocomplete: 'off', placeholder: 'sk-ant-…' }))),
      el('p', { class: 'note' }, 'With a key, Claude writes the between-set coaching and reads the bar weight from the camera when the plates are clearly readable. One frame per set is sent to Anthropic for that. The key stays in this browser. Without a key, coaching uses built-in rules and you enter the weight.'),
      el('div', { class: 'grid2' },
        field('Claude model', sel(T, 'model', [['claude-opus-5-5', 'Opus 5.5'], ['claude-haiku-5-5', 'Haiku 5.5 (faster, cheaper)']])),
        field('Read bar weight', sel(T, 'readBar', [['true', 'When readable'], ['false', 'Never']]))),
      el('div', { class: 'grid2' },
        field('Spoken feedback', sel(T, 'voice', [['all', 'Rep count and cues'], ['cues', 'Cues only'], ['off', 'Off']])),
        field('Tracking accuracy', sel(T, 'accuracy', [['lite', 'Fast'], ['full', 'Balanced'], ['heavy', 'Most accurate']]))),
      el('div', { class: 'grid2' },
        field('Mirror the picture', sel(T, 'mirror', [['true', 'On'], ['false', 'Off']])),
        field('Camera', el('select', { id: 'f-camera', onchange: (e) => { T.camera = e.target.value; save(); } }, el('option', { value: '' }, 'Default')))),
      el('p', { class: 'note' }, 'Accuracy, camera and mirror changes apply after you reload the page.'),
      el('div', { class: 'grid2' },
        field('Voice', sel(T, 'voiceName', [['', 'Best available'], ...voices.map((v) => [v.name, v.name.replace(/Microsoft |Google /, '')])])),
        el('label', { class: 'field' }, 'Hear it', el('button', { class: 'btn', id: 'voiceTest', onclick: () => say('Nice work. Eight reps, and every one looked clean. Rest up.', true) }, 'Play a sample'))),
      el('p', { class: 'note' }, 'Voices come from your browser and computer, and some sound far more natural than others. On a Mac, downloading a Premium or Enhanced voice (System Settings, Accessibility, Spoken Content) usually adds better ones to this list.')];
    queueMicrotask(async () => {
      try {
        const s = $('f-camera'); if (!s || !navigator.mediaDevices?.enumerateDevices) return;
        for (const d of (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput' && d.deviceId)) s.append(el('option', { value: d.deviceId, selected: d.deviceId === T.camera }, d.label || 'Camera'));
      } catch (e) { /* list unavailable */ }
    });
    return out;
  }

  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName) || !tracker) return;
    if (e.code === 'KeyF') { e.preventDefault(); flagOpen(); return; }
    if (e.code !== 'Space') return;
    e.preventDefault(); recEvent('endNow', { by: 'key' }); const ev = tracker.endNow(clock()); if (ev) onEvents([ev]);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && running) navigator.wakeLock?.request('screen').catch(() => {}); });

  if (S.onboarded == null) S.onboarded = !S.example || S.history.length > 0 || !!S.draft;
  if (S.draft) { sess = S.draft; selectItem(Math.min(sess.idx, sess.items.length - 1)); }
  renderGate(); renderHud(); renderPane(); recLoad();
  Object.assign(hooks, { rec: () => rec || lastRec }, { state: () => ({ phase, sess, lastM, running, coachMsg, summary }), feed: onEvents, S });
})();
</script>
